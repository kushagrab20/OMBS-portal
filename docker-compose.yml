version: '3.8'

services:
  eureka-server:
    build:
      context: ./backend/eureka-server
    ports:
      - "8761:8761"
    networks:
      - ombs-net

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  user-service:
    build:
      context: ./backend/user-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  matching-service:
    build:
      context: ./backend/matching-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  payment-service:
    build:
      context: ./backend/payment-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  feedback-service:
    build:
      context: ./backend/feedback-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  report-service:
    build:
      context: ./backend/report-service
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

  gateway-service:
    build:
      context: ./backend/gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - ombs-net

networks:
  ombs-net:
    driver: bridge
