<!-- Navigation Header -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3" 
     style="background: linear-gradient(135deg, #141e30 0%, #243b55 100%) !important; border-bottom: 2px solid rgba(255,255,255,0.05);">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/">
      <i class="bi bi-house-heart-fill text-info fs-3"></i>
      <span class="fs-4 tracking-tight">OMBS Portal</span>
    </a>
    
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>
        <li class="nav-item" *ngIf="authService.isLoggedIn()">
          <a class="nav-link px-3" [routerLink]="dashboardLink" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </a>
        </li>
      </ul>
      
      <!-- Right Side Actions -->
      <div class="d-flex align-items-center gap-3">
        <ng-container *ngIf="!authService.isLoggedIn(); else loggedInView">
          <a routerLink="/login" class="btn btn-link text-white text-decoration-none fw-semibold">Sign In</a>
          <a routerLink="/register" class="btn btn-primary rounded-pill px-4 shadow-sm">Register</a>
        </ng-container>
        
        <ng-template #loggedInView>
          <div class="d-flex align-items-center gap-2 text-white bg-white-10 rounded-pill px-3 py-1.5 border border-white-10">
            <i class="bi bi-person-circle fs-5 text-primary"></i>
            <span class="small fw-semibold">User: {{authService.getUserId()}}</span>
            <span class="badge bg-secondary-subtle text-secondary px-2 rounded-pill small ms-1">{{authService.getRole()}}</span>
          </div>
          <button (click)="logout()" class="btn btn-outline-light rounded-pill btn-sm px-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

<!-- Main Container -->
<main class="bg-light" style="min-height: 80vh;">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="bg-dark text-white-50 py-4 mt-auto border-top border-secondary-subtle">
  <div class="container text-center">
    <div class="d-flex justify-content-center gap-4 mb-3">
      <a routerLink="/" class="text-white-50 text-decoration-none small hover-white">Home</a>
      <span class="text-secondary">|</span>
      <a routerLink="/login" class="text-white-50 text-decoration-none small hover-white">Sign In</a>
      <span class="text-secondary">|</span>
      <a routerLink="/register" class="text-white-50 text-decoration-none small hover-white">Register</a>
    </div>
    <p class="mb-0 small">&copy; 2026 Online Maid Bureau System (OMBS). Designed with verified security compliance & role authorization.</p>
  </div>
</footer>
